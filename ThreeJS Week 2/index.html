<!DOCTYPE html>
<html lang="en">
    <head>
        <title>ThreeJS Boilerplate</title>
        <style>
            body {
                margin: 0;
            }

            #failedDom{
                position: absolute;
                top: 50%;
                left: 50%;
                translate: -50% -50%;
                padding: 10px;
                border-radius: 4px;
                display: none;
                background: #232323;
            }
        </style>
    </head>
    <body>
        <!-- JavaScript module - ThreeJS Version 166 -->
        <!-- We can also use importmap instead of Js Module -->
        <div id="failedDom">

        </div>
        <script src="./script/app.js" type="module"></script>
    </body>
</html>
